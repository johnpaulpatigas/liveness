services:
  - type: web
    name: liveness-api
    runtime: node
    rootDir: apps/saas-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://liveness.cloud
      - key: APP_URL
        sync: false # e.g. https://liveness.cloud
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
